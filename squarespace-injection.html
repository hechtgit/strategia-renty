<script>
(function () {
  if (window.__czNovaVerzia) return;
  window.__czNovaVerzia = true;

  var APP = "https://hechtgit.github.io/strategia-renty/cara-zivota.html?v=27";

  function mount() { return document.getElementById("ph-renta-calculator"); }

  /* 1. Aplikácia: prepnutie rámu na novú verziu.

     Pôvodný code block stránky (ph-renta-embed-fix-v1-js) si adresu rámu prepisuje
     sám a dosadzuje do nej vlastnú, zamrznutú verziu. Beží po nás, takže jednorazové
     nastavenie by neprežilo — a hlavne by tým prestal fungovať cache-buster, čiže
     po nasadení novej verzie by návštevníkom zostala v cache tá stará.
     Adresu preto strážime a po každom cudzom zásahu ju vrátime.

     Strážiť sa ale smie iba dovtedy, kým je v ráme aplikácia. Po odoslaní kontaktu
     si rám sám prejde na modeláciu — tú by sme inak okamžite prepísali späť. */
  var straz = null;
  var editorOtvoreny = false;
  var poslednaVyskaAplikacie = 0;
  /* Legacy skript stránky mieri na koreň repozitára — teda na pôvodnú kalkulačku —
     s vlastnou zamrznutou verziou. Nestačí preto strážiť len adresu aplikácie:
     do rámu patrí aplikácia vždy, s jedinou výnimkou modelácie, na ktorú si rám
     po odoslaní kontaktu prejde sám. */
  function jeModelacia(src) {
    return !!src && src.indexOf("vysledok.html") > -1;
  }
  function jeAplikacia(src) {
    return src === APP || (!!src && src.indexOf(APP + "&frame=") === 0);
  }
  function oprav() {
    var m = mount(); if (!m) return false;
    var f = m.querySelector("iframe"); if (!f) return false;
    var src = f.getAttribute("src");
    if (!jeModelacia(src) && !jeAplikacia(src)) f.setAttribute("src", APP);
    return true;
  }
  function prepniRam() {
    var m = mount(); if (!m) return false;
    if (!oprav()) return false;
    var f = m.querySelector("iframe");
    /* Squarespace vytvára rám s loading=lazy. Pri rýchlom prepise src môže
       prehliadač dokončiť pôvodnú odloženú navigáciu na koreň repozitára,
       hoci atribút src už ukazuje na novú aplikáciu. Po prvom load preto rám
       raz vedome navigujeme na unikátnu adresu novej aplikácie. */
    if (f && !f.__czVynutenaAplikacia) {
      f.__czVynutenaAplikacia = true;
      f.removeAttribute("loading");
      f.addEventListener("load", function vynutAplikaciu() {
        f.removeEventListener("load", vynutAplikaciu);
        if (!jeModelacia(f.getAttribute("src"))) {
          f.setAttribute("src", APP + "&frame=1");
        }
      });
    }
    /* Sledujeme celý kontajner, nie samotný rám: legacy skript vie rám nahradiť
       novým prvkom a strážca pripnutý na starý uzol by potom strážil odpojený
       kus DOM. Takto zachytíme aj výmenu prvku, aj prepis atribútu. */
    if (!straz && window.MutationObserver) {
      straz = new MutationObserver(oprav);
      straz.observe(m, { childList: true, subtree: true,
                         attributes: true, attributeFilter: ["src"] });
    }
    return true;
  }

  /* 2. Rám sa po odoslaní vymení za modeláciu. Stránka pritom zostane odrolovaná
        tam, kde bola, takže by klient pristál uprostred textu — modelácia si preto
        vypýta posun na svoj začiatok. */
  var POVOLENY_POVOD = "https://hechtgit.github.io";

  /* Správy berieme len od vlastného rámu. Bez tejto kontroly by scroll stránky
     alebo jej výšku vedel meniť ktorýkoľvek iný rám či skript na stránke. */
  function odNasho(e) {
    if (e.origin !== POVOLENY_POVOD) return null;
    var m = mount(); if (!m) return null;
    var f = m.querySelector("iframe");
    if (!f || e.source !== f.contentWindow) return null;
    return { mount: m, ram: f };
  }

  window.addEventListener("message", function (e) {
    if (!e.data) return;
    var c = odNasho(e); if (!c) return;

    /* Výška rámu. Pôvodný code block stránky si síce výšku zapisuje do atribútu
       na <html>, ale rámu ju nenastaví — ten má napevno 1700 px. Aplikácia aj
       modelácia sú vyššie, takže bez tohto by im spodok chýbal. */
    if (e.data.type === "ph-renta-height") {
      var h = Number(e.data.height) || 0;
      if (h < 400 || h > 8000) return;              /* zjavný nezmysel ignorujeme */
      poslednaVyskaAplikacie = h;
      if (editorOtvoreny) return;
      if (c.ram.style.height !== h + "px") c.ram.style.height = h + "px";
      return;
    }

    /* Mobilný editor má mať výšku obrazovky, nie výšku celej vloženej stránky. */
    if (e.data.type === "ph-renta-editor") {
      editorOtvoreny = !!e.data.open;
      if (editorOtvoreny) {
        var obsah = Number(e.data.height) || window.innerHeight;
        c.ram.style.height = Math.min(Math.max(360, obsah), window.innerHeight) + "px";
        var hlavicka = document.querySelector("header, #header, .Header");
        var odsadenie = hlavicka ? Math.ceil(hlavicka.getBoundingClientRect().height) + 12 : 92;
        var top = c.mount.getBoundingClientRect().top + window.pageYOffset - odsadenie;
        window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
      } else if (poslednaVyskaAplikacie) {
        c.ram.style.height = poslednaVyskaAplikacie + "px";
      }
      return;
    }

    /* Rám sa po odoslaní vymení za modeláciu, stránka pritom zostane odrolovaná
       tam, kde bola — modelácia si preto vypýta posun na svoj začiatok. */
    if (e.data.type === "ph-renta-na-zaciatok") {
      var y = c.mount.getBoundingClientRect().top + window.pageYOffset - 80;
      window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
    }
  });

  /* 2. Úvod: schválené texty vľavo, obraz vpravo; audio sa zachytí o značku nižšie */
  function vlozUvod() {
    if (document.getElementById("cz-uvod")) return;
    var m = mount(); if (!m || !m.parentNode) return;

    var lead = document.createElement("section");
    lead.id = "cz-uvod";
    lead.className = "cz-hero";
    lead.innerHTML =
      '<article class="cz-hero-card">' +
        '<div class="cz-hero-copy">' +
          '<h1>Stratégia privátnej renty</h1>' +
          '<p><span>Majetok sám osebe nie je príjem.</span><span>Aj majitelia hodnotných portfólií často nevedia,</span><span>koľko si z majetku môžu mesačne vyplácať,</span><span>aby ho nevyčerpali skôr, než plánovali.</span></p>' +
          '<a class="cz-jump" href="#ph-renta-calculator">Prejsť priamo k aplikácii <span aria-hidden="true">↓</span></a>' +
        '</div>' +
        '<div class="cz-hero-image" aria-hidden="true"></div>' +
      '</article>';

    var telo = document.createElement("section");
    telo.className = "cz-body";
    var audioSlug = window.matchMedia("(max-width:480px)").matches
      ? "strategia-privatnej-renty-mobile"
      : "strategia-privatnej-renty";
    telo.innerHTML =
      '<div id="cz-audio" data-adam-audio-slug="' + audioSlug + '" data-adam-audio-wrap="false"></div>' +
      '<section class="cz-info"><h2>Ako aplikácia funguje?</h2><div class="cz-info-grid">' +
        '<p>Základom aplikácie je <strong>Čiara života</strong> a <strong>tri pohyblivé míľniky</strong>. Prvý predstavuje dnešok, druhý vek, od ktorého chcete začať čerpať privátnu rentu, a tretí obdobie, dokedy má renta pokračovať. Keď ktorýkoľvek míľnik posuniete, aplikácia celý scenár okamžite prepočíta.</p>' +
        '<p>V karte <strong>Dnes</strong> si zvolíte, či <strong>majetok ešte len budujete, alebo ho už máte</strong>. Pri budovaní môžete kombinovať jednorazovú investíciu s pravidelným investovaním a zistiť, aký kapitál potrebujete pripraviť. Ak už majetok máte, aplikácia ukáže, akú mesačnú rentu môže prinášať alebo ako dlho by pri zvolenom čerpaní mohol vydržať.</p>' +
        '<p>Následne nastavíte <strong>začiatok výplaty</strong>, mesačnú rentu v dnešnej hodnote a <strong>koniec čerpania</strong>. Zvoliť môžete aj rentu bez časového obmedzenia. Zhodnotenie si určujete sami a inflácia je vo výpočte započítaná tak, aby výsledok pracoval s dnešnou kúpnou silou.</p>' +
        '<p><strong>Základný orientačný prepočet</strong> nevyžaduje meno, e-mail ani telefón. <strong>Rozšírená modelácia</strong>, ktorú si môžete nechať poslať a stiahnuť ako PDF, pridáva historický pohľad na budovanie majetku cez MSCI World. Počas čerpania používa jednotný plánovací predpoklad štyri percentá ročne po investičných nákladoch, pred infláciou. Nejde o predpoveď ani garanciu, ale o pohľad na citlivosť vášho plánu.</p>' +
      '</div></section>' +
      '<section class="mobile-how-box"><h2>Ako aplikácia funguje?</h2>' +
        '<p class="mobile-how-teaser">Základom aplikácie je <strong>Čiara života</strong> a <strong>tri pohyblivé míľniky</strong>. Ťuknutím na kartu otvoríte jej nastavenie a potiahnutím zmeníte vek.</p>' +
        '<details><summary>Viac</summary><div class="mobile-how-more">' +
          '<p>Prvý míľnik predstavuje dnešok, druhý vek, od ktorého chcete začať čerpať privátnu rentu, a tretí obdobie, dokedy má renta pokračovať. Po každej zmene sa celý scenár okamžite prepočíta a súhrn zvoleného plánu sa zobrazí pod Čiarou života.</p>' +
          '<p>V karte <strong>Dnes</strong> si zvolíte, či majetok ešte len budujete, alebo ho už máte. Pri budovaní môžete kombinovať jednorazovú investíciu s pravidelným investovaním. Ak už majetok máte, aplikácia ukáže, akú mesačnú rentu môže prinášať alebo ako dlho by pri zvolenom čerpaní mohol vydržať.</p>' +
          '<p>Následne nastavíte začiatok výplaty, mesačnú rentu v dnešnej hodnote a koniec čerpania. Zvoliť môžete aj rentu bez časového obmedzenia. Zhodnotenie si určujete sami a inflácia je vo výpočte započítaná automaticky.</p>' +
          '<p>Základný orientačný prepočet nevyžaduje meno, e-mail ani telefón. Rozšírenú modeláciu si môžete nechať poslať a stiahnuť ako PDF.</p>' +
        '</div></details></section>';

    m.parentNode.insertBefore(lead, m);
    m.parentNode.insertBefore(telo, m);

    /* Pôvodný audio skript má vlastnú prázdnu kotvu nad kalkulačkou. Presunieme
       ju do schváleného audio bloku ešte pred vykreslením prehrávača; inak by
       najprv narástla nad hero sekciou a o chvíľu sa presunula, čo spôsobuje CLS. */
    var povodnaAudioKotva = document.getElementById("adam-audio-mount");
    var cielAudio = document.getElementById("cz-audio");
    if (povodnaAudioKotva) {
      /* Globálny prehrávač sa môže na stránke vykresliť skôr než tento page
         injection. Kotve preto priradíme správny responzívny slug ešte pred
         presunom a prípadný prehrávač s nesprávnym zdrojom necháme znovu
         vytvoriť nižšie. */
      povodnaAudioKotva.setAttribute("data-adam-audio-slug", audioSlug);
      povodnaAudioKotva.setAttribute("data-adam-audio-wrap", "false");
      if (cielAudio && povodnaAudioKotva.parentNode !== cielAudio)
        cielAudio.appendChild(povodnaAudioKotva);
    }
  }

  /* 3. Audio: prehrávač beží skôr, než vznikne kotva vyššie, a nemá vlastný retry.
        Po vložení úvodu ho preto načítame ešte raz — vtedy už kotvu nájde.
        Skript nemá ochranu proti dvojitému behu, poistkou je kontrola nižšie. */
  function nacitajPrehravac() {
    var mount = document.getElementById("cz-audio");
    if (!mount) return;                                         // kotva ešte nie je
    var existujuci = document.getElementById("adam-player");
    if (existujuci) {
      var zvolenySlug = mount.getAttribute("data-adam-audio-slug") || "";
      var existujuceAudio = existujuci.querySelector("audio");
      var existujuciZdroj = existujuceAudio ? (existujuceAudio.currentSrc || existujuceAudio.src || "") : "";
      if (zvolenySlug && existujuciZdroj && existujuciZdroj.indexOf("/" + zvolenySlug + ".mp3") === -1) {
        existujuci.remove();
        window.__czPrehravacNacitany = false;
        existujuci = null;
      }
    }
    if (existujuci) {
      if (existujuci.parentNode !== mount) mount.appendChild(existujuci);
      return;
    }
    if (window.__czPrehravacNacitany) return;
    window.__czPrehravacNacitany = true;
    var s = document.createElement("script");
    s.src = "https://hechtgit.github.io/adam-audio/adam-player.js?v=4c9ab5c";
    document.body.appendChild(s);
  }

  function upravTextPrehravaca() {
    var mount = document.getElementById("cz-audio"); if (!mount) return;
    var ps = mount.querySelectorAll("p");
    for (var i = 0; i < ps.length; i++) {
      if (/Nechce sa vám čítať|Adam vám článok prečíta/.test(ps[i].textContent || "")) {
        if (ps[i].getAttribute("data-cz-audio-copy") === "1") return;
        ps[i].setAttribute("data-cz-audio-copy", "1");
        ps[i].innerHTML = 'Nechce sa vám čítať?<br><b style="color:#c49a63;font-weight:500">Adam</b> vám stručne vysvetlí, ako aplikácia funguje.';
        return;
      }
    }
  }

  function setup() {
    prepniRam(); vlozUvod(); nacitajPrehravac(); upravTextPrehravaca();
    if (mount() && document.getElementById("cz-uvod")) {
      document.documentElement.classList.add("cz-renta-ready");
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setup);
  else setup();
  window.addEventListener("load", setup);
  [300, 900, 2000, 3500].forEach(function (ms) { setTimeout(setup, ms); });
  if (window.MutationObserver) new MutationObserver(upravTextPrehravaca).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
