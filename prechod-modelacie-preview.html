<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Náhľad prechodu modelácie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#292929;--gold:#ae8753;--gold-hi:#d0ab73;--ink:#f6f1e9;--muted:#c4bdb4}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
  body{min-height:100vh;display:grid;place-items:center;padding:32px;font:16px/1.55 Asap,Arial,sans-serif}
  main{width:min(780px,100%);text-align:center}
  .brand{margin:0;color:var(--gold-hi);font:400 clamp(31px,4vw,45px)/1.15 "PT Serif",Georgia,serif;letter-spacing:.01em}
  .journey{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:70px auto 0;max-width:680px}
  .track,.progress{position:absolute;left:16.66%;right:16.66%;top:10px;height:2px}
  .track{background:rgba(174,135,83,.36);box-shadow:0 0 8px rgba(174,135,83,.09)}
  .progress{right:auto;width:0;background:linear-gradient(90deg,#9c7139,var(--gold-hi),#ebc889);box-shadow:0 0 8px rgba(208,171,115,.4),0 0 20px rgba(174,135,83,.16);transition:width 1.02s cubic-bezier(.22,.61,.36,1)}
  .spark{position:absolute;z-index:3;top:4px;left:16.66%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#f3d59f;box-shadow:0 0 8px 3px rgba(238,197,135,.72),0 0 25px 10px rgba(174,135,83,.28),0 0 46px 16px rgba(174,135,83,.10);opacity:0;transition:left 1.02s cubic-bezier(.22,.61,.36,1),opacity .27s ease}
  .step{position:relative;padding-top:38px;color:#817b73;font-size:15px;font-weight:500;transition:color .4s ease,text-shadow .4s ease}
  .dot{position:absolute;z-index:2;top:3px;left:50%;width:16px;height:16px;margin-left:-8px;border:1.5px solid var(--gold);border-radius:50%;background:var(--bg);transition:background .35s ease,box-shadow .35s ease,transform .35s ease}
  .step.lit .dot{background:var(--gold-hi);box-shadow:0 0 12px rgba(208,171,115,.55)}
  .step.revealed{color:var(--gold-hi);font-size:18px;text-shadow:0 0 14px rgba(208,171,115,.24)}
  .step.active .dot{transform:scale(1.12);animation:breathe 2.175s ease-in-out infinite}
  .journey.finish .progress{box-shadow:0 0 13px rgba(208,171,115,.75),0 0 32px rgba(174,135,83,.22)}
  .journey.finish .dot{box-shadow:0 0 12px rgba(208,171,115,.55)}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(208,171,115,0),0 0 8px rgba(208,171,115,.2)}50%{box-shadow:0 0 0 10px rgba(208,171,115,.18),0 0 18px rgba(208,171,115,.5)}}
  @media(max-width:560px){body{padding:24px}.journey{margin-top:54px;gap:5px}.step{font-size:12px}.step.revealed{font-size:14px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.progress{width:66.68%!important}.spark{display:none}.step{color:#ddd6cd}.dot{background:var(--gold-hi)}}
</style>
</head>
<body>
<main>
  <h1 class="brand">Stratégia privátnej renty</h1>
  <div class="journey" id="journey" aria-label="Priebeh prípravy modelácie">
    <span class="track" aria-hidden="true"></span>
    <span class="progress" aria-hidden="true"></span>
    <span class="spark" aria-hidden="true"></span>
    <div class="step"><span class="dot"></span>Scenár prijatý</div>
    <div class="step"><span class="dot"></span>Prebieha overenie</div>
    <div class="step"><span class="dot"></span>Otvárame výsledok</div>
  </div>
</main>
<script>
  const journey=document.getElementById('journey');
  const steps=[...journey.querySelectorAll('.step')];
  const progress=journey.querySelector('.progress');
  const spark=journey.querySelector('.spark');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait=ms=>new Promise(ok=>setTimeout(ok,ms));
  async function play(){
    if(reduce)return;
    journey.classList.remove('finish');
    steps.forEach(s=>s.className='step');
    progress.style.width='0';spark.style.left='16.66%';spark.style.opacity='0';
    await wait(390);
    steps[0].classList.add('lit','active');spark.style.opacity='1';
    await wait(105);
    steps[0].classList.add('revealed');
    await wait(570);
    steps[0].classList.remove('active');progress.style.width='33.34%';spark.style.left='50%';
    await wait(1020);
    steps[1].classList.add('lit','active');
    await wait(105);
    steps[1].classList.add('revealed');
    await wait(510);
    steps[1].classList.remove('active');progress.style.width='66.68%';spark.style.left='83.34%';
    await wait(1020);
    steps[2].classList.add('lit','active');
    await wait(105);
    steps[2].classList.add('revealed');
    await wait(630);
    steps[2].classList.remove('active');journey.classList.add('finish');spark.style.opacity='0';
    await wait(780);
    await wait(1500);
    play();
  }
  play();
</script>
</body>
</html>
