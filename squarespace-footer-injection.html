<script>
document.addEventListener("DOMContentLoaded", function () {

  const images = Array.from(document.querySelectorAll(".custom-lightbox-image"));
  let currentIndex = 0;
  let overlay, largeImage;

  function openLightbox(index) {
    currentIndex = index;

    overlay = document.createElement("div");
    overlay.className = "custom-lightbox-overlay";

    largeImage = document.createElement("img");
    largeImage.className = "custom-lightbox-image-large";
    largeImage.src = images[currentIndex].src;

    // Close button
    const closeBtn = document.createElement("div");
    closeBtn.className = "lightbox-close";
    closeBtn.innerHTML = "&times;";
    closeBtn.onclick = closeLightbox;

    // Arrows
    const prev = document.createElement("div");
    prev.className = "lightbox-arrow lightbox-prev";
    prev.innerHTML = "&#10094;";
    prev.onclick = showPrev;

    const next = document.createElement("div");
    next.className = "lightbox-arrow lightbox-next";
    next.innerHTML = "&#10095;";
    next.onclick = showNext;

    overlay.appendChild(largeImage);
    overlay.appendChild(closeBtn);
    overlay.appendChild(prev);
    overlay.appendChild(next);
    document.body.appendChild(overlay);

    setTimeout(() => overlay.classList.add("active"), 10);

    overlay.addEventListener("click", function(e){
      if (e.target === overlay) closeLightbox();
    });

    document.addEventListener("keydown", handleKeys);
  }

  function closeLightbox() {
    overlay.classList.remove("active");
    setTimeout(() => {
      document.body.removeChild(overlay);
    }, 300);
    document.removeEventListener("keydown", handleKeys);
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % images.length;
    largeImage.src = images[currentIndex].src;
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    largeImage.src = images[currentIndex].src;
  }

  function handleKeys(e) {
    if (e.key === "ArrowRight") showNext();
    if (e.key === "ArrowLeft") showPrev();
    if (e.key === "Escape") closeLightbox();
  }

  images.forEach((img, index) => {
    img.addEventListener("click", () => openLightbox(index));
  });

});
</script>

<script>
(function () {
  var AUTHOR_BOX_ID = "ph-global-author-box";
  var PHOTO_URL = "https://images.squarespace-cdn.com/content/v1/5aa7b897aa49a1758e33ac89/0d9992b9-2b06-416a-a3dc-69511312a44a/peto_farebna_2.png?format=1000w";

  function normalizeText(value) {
    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function isBlogArticle() {
    var path = window.location.pathname || "";
    var context = window.Static && window.Static.SQUARESPACE_CONTEXT;
    var itemUrl = context && context.item && context.item.fullUrl;
    if (!/^\/blog\/[^/]+\/?$/.test(path)) return false;
    if (/^\/blog\/(category|tag)\//.test(path)) return false;
    return Boolean(document.querySelector(".BlogItem")) || (itemUrl && itemUrl.indexOf("/blog/") === 0);
  }

  function createAuthorBox() {
    var section = document.createElement("section");
    section.id = AUTHOR_BOX_ID;
    section.className = "ph-author-box";
    section.setAttribute("aria-label", "O autorovi");
    section.innerHTML =
      '<div class="ph-author-box__media">' +
        '<img class="ph-author-box__photo" src="' + PHOTO_URL + '" alt="Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko">' +
      "</div>" +
      '<div class="ph-author-box__bio">' +
        '<h2 class="ph-author-box__name">Petr Hechtberger</h2>' +
        '<p class="ph-author-box__copy">Autorom \u010dl\u00e1nku je Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko. Zameriava sa na strategick\u00fa spr\u00e1vu majetku a kapit\u00e1lu pre klientov s v\u00e4\u010d\u0161\u00edm majetkom, najm\u00e4 majite\u013eov firiem, lek\u00e1rov s vlastnou praxou a rodiny, ktor\u00e9 potrebuj\u00fa rie\u0161i\u0165 hotovos\u0165, invest\u00edcie, firmu, rodinn\u00fd majetok a rizik\u00e1 ako jeden zrozumite\u013en\u00fd celok.</p>' +
        '<p class="ph-author-box__copy">So svoj\u00edm t\u00edmom p\u00f4sob\u00ed vo Wealth Management Office Swiss Life Select v \u017diline na Framborskej ulici a s klientmi spolupracuje naprie\u010d Slovenskom, osobne aj online.</p>' +
      "</div>";
    return section;
  }

  function normalizeMisusedHeadings(article) {
    var headings = Array.prototype.slice.call(article.querySelectorAll(".sqs-html-content h2, .sqs-html-content h3"));
    headings.forEach(function (heading) {
      var text = String(heading.textContent || "").replace(/\s+/g, " ").trim();
      if (!text) {
        heading.setAttribute("data-ph-author-hidden", "1");
        return;
      }

      if (text.length < 130) return;
      if (normalizeText(text).indexOf("autorom clanku je petr hechtberger") === 0) return;

      var paragraph = document.createElement("p");
      paragraph.className = "ph-normalized-copy";
      paragraph.innerHTML = heading.innerHTML;
      paragraph.style.whiteSpace = heading.style.whiteSpace || "pre-wrap";
      heading.parentNode.replaceChild(paragraph, heading);
    });
  }

  function hideLegacyAuthorBlocks(article) {
    var headings = Array.prototype.slice.call(article.querySelectorAll("h2, h3"));
    headings.forEach(function (heading) {
      var text = normalizeText(heading.textContent);
      var isLegacyHeading =
        text === "o autorovi" ||
        text.indexOf("kto vam radi") === 0 ||
        text.indexOf("kto vam rad\u00ed") === 0 ||
        (text.indexOf("kto vam") === 0 && text.indexOf("radi") !== -1);

      if (!isLegacyHeading) return;

      var current = heading;
      var limit = 0;
      while (current && limit < 12) {
        var next = current.nextElementSibling;
        current.setAttribute("data-ph-author-hidden", "1");
        if (!next || (/^H[23]$/.test(next.tagName) && normalizeText(next.textContent) !== text)) break;
        current = next;
        limit += 1;
      }
    });

    var legacyAuthorNodes = Array.prototype.slice.call(article.querySelectorAll("p, h2, h3, h4, a"));
    legacyAuthorNodes.forEach(function (node) {
      var text = normalizeText(node.textContent);
      if (text.indexOf("autorom clanku je petr hechtberger") !== 0) return;
      node.setAttribute("data-ph-author-hidden", "1");
      var next = node.nextElementSibling;
      var limit = 0;
      while (next && limit < 8) {
        var nextText = normalizeText(next.textContent);
        var isLegacyCta =
          nextText === "nezavazna konzultacia" ||
          nextText.indexOf("ak chcete do spravy") === 0 ||
          nextText.indexOf("ak mate pocit") === 0 ||
          nextText.indexOf("rezervovat konzultaciu") === 0;

        if (!isLegacyCta) break;
        next.setAttribute("data-ph-author-hidden", "1");
        next = next.nextElementSibling;
        limit += 1;
      }
    });
  }

  function withVideoOrigin(src) {
    try {
      var url = new URL(src, window.location.href);
      if (!url.searchParams.get("origin")) {
        url.searchParams.set("origin", window.location.origin);
      }
      return url.toString();
    } catch (error) {
      return src;
    }
  }

  function hardenYouTubeEmbeds(article) {
    var frames = Array.prototype.slice.call(
      article.querySelectorAll('iframe[src*="youtube.com/embed/"], iframe[src*="youtube-nocookie.com/embed/"]')
    );

    frames.forEach(function (frame) {
      if (frame.getAttribute("data-ph-youtube-hardened") === "1") return;

      var src = frame.getAttribute("src");
      if (!src) return;

      var clone = frame.cloneNode(true);
      clone.setAttribute("data-ph-youtube-hardened", "1");
      clone.setAttribute("src", withVideoOrigin(src));
      clone.setAttribute("title", frame.getAttribute("title") || "YouTube video");
      clone.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
      clone.setAttribute("allowfullscreen", "");
      clone.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");

      frame.parentNode.replaceChild(clone, frame);
    });
  }

  function insertAuthorBox() {
    if (!isBlogArticle()) return;

    var article = document.querySelector(".BlogItem");
    if (!article) return;

    var body = article.querySelector('.sqs-layout[data-layout-label="Post Body"]') || article.querySelector(".sqs-layout");
    if (!body) return;

    normalizeMisusedHeadings(article);
    hideLegacyAuthorBlocks(article);
    hardenYouTubeEmbeds(article);

    var existing = document.getElementById(AUTHOR_BOX_ID);
    if (existing) existing.remove();

    var authorBox = createAuthorBox();
    body.insertAdjacentElement("afterend", authorBox);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", insertAuthorBox);
  } else {
    insertAuthorBox();
  }

  window.addEventListener("mercury:load", insertAuthorBox);
})();
</script>

<script id="ph-ai-visibility-article-context-v3">
(function(){if(window.__phAiArticleContextV3)return;window.__phAiArticleContextV3=true;var CONTEXT_BY_PATH={"/blog/inspiracie-marec":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Marcov\u00e1 epiz\u00f3da sa pozer\u00e1 na to, ako r\u00fdchlo sa m\u00f4\u017eu zmeni\u0165 trhov\u00e9 predpoklady, ke\u010f do cien akt\u00edv vst\u00fapia cl\u00e1, politika a obava z recesie. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, \u010d\u00edta tento v\u00fdvoj cez optiku strategickej spr\u00e1vy majetku: nie ako d\u00f4vod na impulz\u00edvny krok, ale ako d\u00f4vod overi\u0165, na ak\u00fdch predpokladoch portf\u00f3lio stoj\u00ed.</p>\n<ul><li>Prudk\u00fd pokles americk\u00fdch akci\u00ed po ozn\u00e1men\u00ed ciel uk\u00e1zal citlivos\u0165 trhov na politick\u00e9 rozhodnutia.</li><li>Riziko recesie a slab\u0161\u00ed sentiment m\u00f4\u017eu meni\u0165 poh\u013ead na pomer medzi americk\u00fdmi a eur\u00f3pskymi akt\u00edvami.</li><li>V\u00fdsledkov\u00e1 sez\u00f3na, infl\u00e1cia a spotrebite\u013esk\u00e1 d\u00f4vera d\u00e1vaj\u00fa kontext, nie hotov\u00fa odpove\u010f pre ka\u017ed\u00e9ho investora.</li></ul>\n<p>Pri v\u00e4\u010d\u0161om kapit\u00e1li m\u00e1 zmysel \u010d\u00edta\u0165 podobn\u00e9 epiz\u00f3dy v kontexte, ktor\u00fd rozv\u00edja <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>.</p>\n</section>","/blog/inspiracie-september":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Septembrov\u00e1 epiz\u00f3da odpoved\u00e1 na ot\u00e1zku, \u010di trhov\u00e9 maxim\u00e1 automaticky znamenaj\u00fa, \u017ee treba st\u00e1\u0165 bokom. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, pos\u00fava pozornos\u0165 k strategickej spr\u00e1ve majetku: \u010di m\u00e1 klient portf\u00f3lio so spolo\u010dnou logikou, alebo len zbierku produktov.</p>\n<ul><li>Trhy reagovali na sign\u00e1ly z Fedu, politick\u00fd tlak aj v\u00fdvoj okolo ciel, no samotn\u00e1 \u00farove\u0148 indexov nesta\u010d\u00ed na rozhodnutie.</li><li>\u010cakanie na ide\u00e1lny moment \u010dasto vedie k tomu, \u017ee kapit\u00e1l zost\u00e1va bez jasn\u00e9ho r\u00e1mca.</li><li>Zbierka produktov sa st\u00e1va portf\u00f3liom a\u017e vtedy, ke\u010f maj\u00fa riziko, likvidita, horizont a cie\u013e spolo\u010dn\u00fa logiku.</li></ul>\n<p>\u0160ir\u0161\u00ed r\u00e1mec tejto t\u00e9my opisuje <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>: najprv architekt\u00fara majetku, a\u017e potom jednotliv\u00e9 n\u00e1stroje.</p>\n</section>","/blog/inspiracie-februar":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Febru\u00e1rov\u00e1 epiz\u00f3da d\u00e1va stru\u010dn\u00fd preh\u013ead udalost\u00ed, ktor\u00e9 m\u00f4\u017eu na prv\u00fd poh\u013ead p\u00f4sobi\u0165 nes\u00favisle: indexy, sentiment, volatilita, \u0161t\u00e1tne dlhopisy a FOMO. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, pou\u017e\u00edva tak\u00fdto mesa\u010dn\u00fd poh\u013ead ako pracovn\u00fd filter pre strategick\u00fa spr\u00e1vu majetku, nie ako s\u00fabor pokynov na n\u00e1kup alebo predaj.</p>\n<ul><li>Glob\u00e1lne indexy ukazuj\u00fa smer trhu, ale samotn\u00e9 \u010d\u00edslo nesta\u010d\u00ed bez pochopenia d\u00f4vodu pohybu.</li><li>Fear & Greed Index a VIX pom\u00e1haj\u00fa \u010d\u00edta\u0165 n\u00e1ladu trhu, nie predpoveda\u0165 bud\u00facnos\u0165.</li><li>FOMO je riziko najm\u00e4 vtedy, ke\u010f rozhodnutie nevych\u00e1dza z cie\u013ea, horizontu a \u00falohy pe\u0148az\u00ed.</li></ul>\n<p>V\u00e4\u010d\u0161\u00ed majetok potrebuje pr\u00e1ve tak\u00fdto filter; preto s t\u00e9mou prirodzene s\u00favis\u00ed <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>.</p>\n</section>","/blog/inspiracie-januar":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Janu\u00e1rov\u00e1 epiz\u00f3da sa s\u00fastre\u010fuje na rozdiel medzi inform\u00e1ciou a \u0161umom: trhy sa h\u00fdbu ka\u017ed\u00fd mesiac, ale nie ka\u017ed\u00e1 spr\u00e1va m\u00e1 meni\u0165 rozhodnutie o majetku. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, zasadzuje koment\u00e1r k trhom do strategickej spr\u00e1vy kapit\u00e1lu, kde je d\u00f4le\u017eit\u00e9 rozl\u00ed\u0161i\u0165, \u010do sledova\u0165 a \u010do necha\u0165 bez reakcie.</p>\n<ul><li>Mesa\u010dn\u00fd v\u00fdvoj indexov m\u00e1 zmysel sledova\u0165 ako kontext, nie ako samostatn\u00fd sp\u00fa\u0161\u0165a\u010d rozhodnut\u00ed.</li><li>Medi\u00e1lny \u0161um a o\u010dak\u00e1vania okolo centr\u00e1lnych b\u00e1nk si vy\u017eaduj\u00fa odstup, najm\u00e4 pri v\u00e4\u010d\u0161om kapit\u00e1li.</li><li>Dlhodob\u00fd r\u00e1mec pom\u00e1ha odl\u00ed\u0161i\u0165 sign\u00e1l od kr\u00e1tkodobej em\u00f3cie trhu.</li></ul>\n<p>Ak m\u00e1 majetok sl\u00fa\u017ei\u0165 aj ochrane, likvidite a rodinnej kontinuite, jeho rozhodovanie patr\u00ed do r\u00e1mca, ktor\u00fd pomen\u00fava <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>.</p>\n</section>"};function p(){return(window.location.pathname||'').replace(/\/$/,'')}function insert(){var html=CONTEXT_BY_PATH[p()];if(!html||document.querySelector('.ph-article-context-block'))return;var article=document.querySelector('.BlogItem');if(!article)return;var title=article.querySelector('.BlogItem-title')||article.querySelector('h1');var body=article.querySelector('.sqs-layout[data-layout-label="Post Body"]')||article.querySelector('.sqs-layout')||article;if(title&&title.parentNode){title.insertAdjacentHTML('afterend',html);return}body.insertAdjacentHTML('afterbegin',html)}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',insert)}else{insert()}window.addEventListener('mercury:load',insert)})();
</script>

  function path(h){ return (h||"").replace(/^https?:\/\/(www\.)?hechtberger\.com/i, "").replace(/\/+$/, ""); }

<script>
document.addEventListener("DOMContentLoaded", function () {

  const images = Array.from(document.querySelectorAll(".custom-lightbox-image"));
  let currentIndex = 0;
  let overlay, largeImage;

  function openLightbox(index) {
    currentIndex = index;

    overlay = document.createElement("div");
    overlay.className = "custom-lightbox-overlay";

    largeImage = document.createElement("img");
    largeImage.className = "custom-lightbox-image-large";
    largeImage.src = images[currentIndex].src;

    // Close button
    const closeBtn = document.createElement("div");
    closeBtn.className = "lightbox-close";
    closeBtn.innerHTML = "&times;";
    closeBtn.onclick = closeLightbox;

    // Arrows
    const prev = document.createElement("div");
    prev.className = "lightbox-arrow lightbox-prev";
    prev.innerHTML = "&#10094;";
    prev.onclick = showPrev;

    const next = document.createElement("div");
    next.className = "lightbox-arrow lightbox-next";
    next.innerHTML = "&#10095;";
    next.onclick = showNext;

    overlay.appendChild(largeImage);
    overlay.appendChild(closeBtn);
    overlay.appendChild(prev);
    overlay.appendChild(next);
    document.body.appendChild(overlay);

    setTimeout(() => overlay.classList.add("active"), 10);

    overlay.addEventListener("click", function(e){
      if (e.target === overlay) closeLightbox();
    });

    document.addEventListener("keydown", handleKeys);
  }

  function closeLightbox() {
    overlay.classList.remove("active");
    setTimeout(() => {
      document.body.removeChild(overlay);
    }, 300);
    document.removeEventListener("keydown", handleKeys);
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % images.length;
    largeImage.src = images[currentIndex].src;
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    largeImage.src = images[currentIndex].src;
  }

  function handleKeys(e) {
    if (e.key === "ArrowRight") showNext();
    if (e.key === "ArrowLeft") showPrev();
    if (e.key === "Escape") closeLightbox();
  }

  images.forEach((img, index) => {
    img.addEventListener("click", () => openLightbox(index));
  });

});
</script>

<script>
(function () {
  var AUTHOR_BOX_ID = "ph-global-author-box";
  var PHOTO_URL = "https://images.squarespace-cdn.com/content/v1/5aa7b897aa49a1758e33ac89/0d9992b9-2b06-416a-a3dc-69511312a44a/peto_farebna_2.png?format=1000w";

  function normalizeText(value) {
    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function isBlogArticle() {
    var path = window.location.pathname || "";
    var context = window.Static && window.Static.SQUARESPACE_CONTEXT;
    var itemUrl = context && context.item && context.item.fullUrl;
    if (!/^\/blog\/[^/]+\/?$/.test(path)) return false;
    if (/^\/blog\/(category|tag)\//.test(path)) return false;
    return Boolean(document.querySelector(".BlogItem")) || (itemUrl && itemUrl.indexOf("/blog/") === 0);
  }

  function createAuthorBox() {
    var section = document.createElement("section");
    section.id = AUTHOR_BOX_ID;
    section.className = "ph-author-box";
    section.setAttribute("aria-label", "O autorovi");
    section.innerHTML =
      '<div class="ph-author-box__media">' +
        '<img class="ph-author-box__photo" src="' + PHOTO_URL + '" alt="Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko">' +

        '<h2 class="ph-author-box__name">Petr Hechtberger</h2>' +
        '<p class="ph-author-box__copy">Autorom \u010dl\u00e1nku je Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko. Zameriava sa na strategick\u00fa spr\u00e1vu majetku a kapit\u00e1lu pre klientov s v\u00e4\u010d\u0161\u00edm majetkom, najm\u00e4 majite\u013eov firiem, lek\u00e1rov s vlastnou praxou a rodiny, ktor\u00e9 potrebuj\u00fa rie\u0161i\u0165 hotovos\u0165, invest\u00edcie, firmu, rodinn\u00fd majetok a rizik\u00e1 ako jeden zrozumite\u013en\u00fd celok.</p>' +
        '<p class="ph-author-box__copy">So svoj\u00edm t\u00edmom p\u00f4sob\u00ed vo Wealth Management Office Swiss Life Select v \u017diline na Framborskej ulici a s klientmi spolupracuje naprie\u010d Slovenskom, osobne aj online.</p>' +
      "</div>";
    return section;
  }

  function normalizeMisusedHeadings(article) {
    var headings = Array.prototype.slice.call(article.querySelectorAll(".sqs-html-content h2, .sqs-html-content h3"));
    headings.forEach(function (heading) {
      var text = String(heading.textContent || "").replace(/\s+/g, " ").trim();
      if (!text) {
        heading.setAttribute("data-ph-author-hidden", "1");
        return;
      }

      if (text.length < 130) return;
      if (normalizeText(text).indexOf("autorom clanku je petr hechtberger") === 0) return;

      var paragraph = document.createElement("p");
      paragraph.className = "ph-normalized-copy";
      paragraph.innerHTML = heading.innerHTML;
      paragraph.style.whiteSpace = heading.style.whiteSpace || "pre-wrap";
      heading.parentNode.replaceChild(paragraph, heading);
    });
  }

  function hideLegacyAuthorBlocks(article) {
    var headings = Array.prototype.slice.call(article.querySelectorAll("h2, h3"));
    headings.forEach(function (heading) {
      var text = normalizeText(heading.textContent);
      var isLegacyHeading =
        text === "o autorovi" ||
        text.indexOf("kto vam radi") === 0 ||
        text.indexOf("kto vam rad\u00ed") === 0 ||
        (text.indexOf("kto vam") === 0 && text.indexOf("radi") !== -1);

      if (!isLegacyHeading) return;

      var current = heading;
      var limit = 0;
      while (current && limit < 12) {
        var next = current.nextElementSibling;
        current.setAttribute("data-ph-author-hidden", "1");
        if (!next || (/^H[23]$/.test(next.tagName) && normalizeText(next.textContent) !== text)) break;
        current = next;
        limit += 1;
      }
    });

    var legacyAuthorNodes = Array.prototype.slice.call(article.querySelectorAll("p, h2, h3, h4, a"));
    legacyAuthorNodes.forEach(function (node) {
      var text = normalizeText(node.textContent);
      if (text.indexOf("autorom clanku je petr hechtberger") !== 0) return;
      node.setAttribute("data-ph-author-hidden", "1");
      var next = node.nextElementSibling;
      var limit = 0;
      while (next && limit < 8) {
        var nextText = normalizeText(next.textContent);
        var isLegacyCta =
          nextText === "nezavazna konzultacia" ||
          nextText.indexOf("ak chcete do spravy") === 0 ||
          nextText.indexOf("ak mate pocit") === 0 ||
          nextText.indexOf("rezervovat konzultaciu") === 0;

        if (!isLegacyCta) break;
        next.setAttribute("data-ph-author-hidden", "1");
        next = next.nextElementSibling;
        limit += 1;
      }
    });
  }

  function withVideoOrigin(src) {
    try {
      var url = new URL(src, window.location.href);
      if (!url.searchParams.get("origin")) {
        url.searchParams.set("origin", window.location.origin);
      }
      return url.toString();
    } catch (error) {
      return src;
    }
  }

  function hardenYouTubeEmbeds(article) {
    var frames = Array.prototype.slice.call(
      article.querySelectorAll('iframe[src*="youtube.com/embed/"], iframe[src*="youtube-nocookie.com/embed/"]')
    );

    frames.forEach(function (frame) {
      if (frame.getAttribute("data-ph-youtube-hardened") === "1") return;

      var src = frame.getAttribute("src");
      if (!src) return;

      var clone = frame.cloneNode(true);
      clone.setAttribute("data-ph-youtube-hardened", "1");
      clone.setAttribute("src", withVideoOrigin(src));
      clone.setAttribute("title", frame.getAttribute("title") || "YouTube video");
      clone.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
      clone.setAttribute("allowfullscreen", "");
      clone.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");

      frame.parentNode.replaceChild(clone, frame);
    });
  }

  function insertAuthorBox() {
    if (!isBlogArticle()) return;

    var article = document.querySelector(".BlogItem");
    if (!article) return;

    var body = article.querySelector('.sqs-layout[data-layout-label="Post Body"]') || article.querySelector(".sqs-layout");
    if (!body) return;

    normalizeMisusedHeadings(article);
    hideLegacyAuthorBlocks(article);
    hardenYouTubeEmbeds(article);

    var existing = document.getElementById(AUTHOR_BOX_ID);
    if (existing) existing.remove();

    var authorBox = createAuthorBox();
    body.insertAdjacentElement("afterend", authorBox);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", insertAuthorBox);
  } else {
    insertAuthorBox();
  }

  window.addEventListener("mercury:load", insertAuthorBox);
})();
</script>

(function(){if(window.__phAiArticleContextV3)return;window.__phAiArticleContextV3=true;var CONTEXT_BY_PATH={"/blog/inspiracie-marec":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Marcov\u00e1 epiz\u00f3da sa pozer\u00e1 na to, ako r\u00fdchlo sa m\u00f4\u017eu zmeni\u0165 trhov\u00e9 predpoklady, ke\u010f do cien akt\u00edv vst\u00fapia cl\u00e1, politika a obava z recesie. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, \u010d\u00edta tento v\u00fdvoj cez optiku strategickej spr\u00e1vy majetku: nie ako d\u00f4vod na impulz\u00edvny krok, ale ako d\u00f4vod overi\u0165, na ak\u00fdch predpokladoch portf\u00f3lio stoj\u00ed.</p>\n<ul><li>Prudk\u00fd pokles americk\u00fdch akci\u00ed po ozn\u00e1men\u00ed ciel uk\u00e1zal citlivos\u0165 trhov na politick\u00e9 rozhodnutia.</li><li>Riziko recesie a slab\u0161\u00ed sentiment m\u00f4\u017eu meni\u0165 poh\u013ead na pomer medzi americk\u00fdmi a eur\u00f3pskymi akt\u00edvami.</li><li>V\u00fdsledkov\u00e1 sez\u00f3na, infl\u00e1cia a spotrebite\u013esk\u00e1 d\u00f4vera d\u00e1vaj\u00fa kontext, nie hotov\u00fa odpove\u010f pre ka\u017ed\u00e9ho investora.</li></ul>\n<p>Pri v\u00e4\u010d\u0161om kapit\u00e1li m\u00e1 zmysel \u010d\u00edta\u0165 podobn\u00e9 epiz\u00f3dy v kontexte, ktor\u00fd rozv\u00edja <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>.</p>\n</section>","/blog/inspiracie-september":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Septembrov\u00e1 epiz\u00f3da odpoved\u00e1 na ot\u00e1zku, \u010di trhov\u00e9 maxim\u00e1 automaticky znamenaj\u00fa, \u017ee treba st\u00e1\u0165 bokom. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, pos\u00fava pozornos\u0165 k strategickej spr\u00e1ve majetku: \u010di m\u00e1 klient portf\u00f3lio so spolo\u010dnou logikou, alebo len zbierku produktov.</p>\n<ul><li>Trhy reagovali na sign\u00e1ly z Fedu, politick\u00fd tlak aj v\u00fdvoj okolo ciel, no samotn\u00e1 \u00farove\u0148 indexov nesta\u010d\u00ed na rozhodnutie.</li><li>\u010cakanie na ide\u00e1lny moment \u010dasto vedie k tomu, \u017ee kapit\u00e1l zost\u00e1va bez jasn\u00e9ho r\u00e1mca.</li><li>Zbierka produktov sa st\u00e1va portf\u00f3liom a\u017e vtedy, ke\u010f maj\u00fa riziko, likvidita, horizont a cie\u013e spolo\u010dn\u00fa logiku.</li></ul>\n<p>\u0160ir\u0161\u00ed r\u00e1mec tejto t\u00e9my opisuje <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>: najprv architekt\u00fara majetku, a\u017e potom jednotliv\u00e9 n\u00e1stroje.</p>\n</section>","/blog/inspiracie-februar":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Febru\u00e1rov\u00e1 epiz\u00f3da d\u00e1va stru\u010dn\u00fd preh\u013ead udalost\u00ed, ktor\u00e9 m\u00f4\u017eu na prv\u00fd poh\u013ead p\u00f4sobi\u0165 nes\u00favisle: indexy, sentiment, volatilita, \u0161t\u00e1tne dlhopisy a FOMO. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, pou\u017e\u00edva tak\u00fdto mesa\u010dn\u00fd poh\u013ead ako pracovn\u00fd filter pre strategick\u00fa spr\u00e1vu majetku, nie ako s\u00fabor pokynov na n\u00e1kup alebo predaj.</p>\n<ul><li>Glob\u00e1lne indexy ukazuj\u00fa smer trhu, ale samotn\u00e9 \u010d\u00edslo nesta\u010d\u00ed bez pochopenia d\u00f4vodu pohybu.</li><li>Fear & Greed Index a VIX pom\u00e1haj\u00fa \u010d\u00edta\u0165 n\u00e1ladu trhu, nie predpoveda\u0165 bud\u00facnos\u0165.</li><li>FOMO je riziko najm\u00e4 vtedy, ke\u010f rozhodnutie nevych\u00e1dza z cie\u013ea, horizontu a \u00falohy pe\u0148az\u00ed.</li></ul>\n<p>V\u00e4\u010d\u0161\u00ed majetok potrebuje pr\u00e1ve tak\u00fdto filter; preto s t\u00e9mou prirodzene s\u00favis\u00ed <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>.</p>\n</section>","/blog/inspiracie-januar":"<section class=\"ph-article-context-block\">\n<h2>Hlavn\u00e9 my\u0161lienky</h2>\n<p>Janu\u00e1rov\u00e1 epiz\u00f3da sa s\u00fastre\u010fuje na rozdiel medzi inform\u00e1ciou a \u0161umom: trhy sa h\u00fdbu ka\u017ed\u00fd mesiac, ale nie ka\u017ed\u00e1 spr\u00e1va m\u00e1 meni\u0165 rozhodnutie o majetku. Petr Hechtberger, Wealth manager senior v Swiss Life Select Slovensko, zasadzuje koment\u00e1r k trhom do strategickej spr\u00e1vy kapit\u00e1lu, kde je d\u00f4le\u017eit\u00e9 rozl\u00ed\u0161i\u0165, \u010do sledova\u0165 a \u010do necha\u0165 bez reakcie.</p>\n<ul><li>Mesa\u010dn\u00fd v\u00fdvoj indexov m\u00e1 zmysel sledova\u0165 ako kontext, nie ako samostatn\u00fd sp\u00fa\u0161\u0165a\u010d rozhodnut\u00ed.</li><li>Medi\u00e1lny \u0161um a o\u010dak\u00e1vania okolo centr\u00e1lnych b\u00e1nk si vy\u017eaduj\u00fa odstup, najm\u00e4 pri v\u00e4\u010d\u0161om kapit\u00e1li.</li><li>Dlhodob\u00fd r\u00e1mec pom\u00e1ha odl\u00ed\u0161i\u0165 sign\u00e1l od kr\u00e1tkodobej em\u00f3cie trhu.</li></ul>\n<p>Ak m\u00e1 majetok sl\u00fa\u017ei\u0165 aj ochrane, likvidite a rodinnej kontinuite, jeho rozhodovanie patr\u00ed do r\u00e1mca, ktor\u00fd pomen\u00fava <a href=\"/strategicka-sprava-kapitalu\">strategick\u00e1 spr\u00e1va kapit\u00e1lu</a>.</p>\n</section>"};function p(){return(window.location.pathname||'').replace(/\/$/,'')}function insert(){var html=CONTEXT_BY_PATH[p()];if(!html||document.querySelector('.ph-article-context-block'))return;var article=document.querySelector('.BlogItem');if(!article)return;var title=article.querySelector('.BlogItem-title')||article.querySelector('h1');var body=article.querySelector('.sqs-layout[data-layout-label="Post Body"]')||article.querySelector('.sqs-layout')||article;if(title&&title.parentNode){title.insertAdjacentHTML('afterend',html);return}body.insertAdjacentHTML('afterbegin',html)}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',insert)}else{insert()}window.addEventListener('mercury:load',insert)})();

<script id="ph-visual-consistency-v1-js">
(function () {
  if (window.__phVisualConsistencyV1) return;
  window.__phVisualConsistencyV1 = true;

  var CTA_TEXT = "Rezervova\u0165 konzult\u00e1ciu";
  var FIRST_TEXT = "Prv\u00e1 konzult\u00e1cia";
  var CTA_HREF = "/rezervacia";
  var FIRST_PATH = "/ako-prebieha-prva-konzultacia";

  function norm(value) {
    return (value || "").replace(/\s+/g, " ").trim();
  }

  function fold(value) {
    return norm(value).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function localPath(href) {
    if (!href) return "";
    try {
      var url = new URL(href, window.location.origin);
      if (url.hostname && !/^(www\.)?hechtberger\.com$/.test(url.hostname) && url.hostname !== window.location.hostname) return "";
      return (url.pathname || "").replace(/\/+$/, "") || "/";
    } catch (err) {
      return String(href).replace(/^https?:\/\/(www\.)?hechtberger\.com/i, "").replace(/\/+$/, "") || "/";
    }
  }

  function isFunctionalButtonText(text) {
    var value = fold(text);
    return /(stiahnut|ebook|investicne inspiracie|precitat|prejst na clanok|video|podcast|map|odoslat|nacitat|prehrat|newsletter|cookies|suhlasim)/.test(value);
  }

  function isConsultButtonText(text) {
    var value = fold(text);
    return /(konzult|rezerv|termin|nezavazn|druhy nazor|mam zaujem o invest|chcem investovat)/.test(value);
  }

  function isConsultHref(href, text) {
    var path = localPath(href);
    if (!path) return false;
    if (path === CTA_HREF || path === FIRST_PATH || path === "/rezervacie") return true;
    if (path.indexOf("/nezavazna-konzultacia") === 0) return true;
    if (path.indexOf("/form-asset-management") === 0) return true;
    if (path.indexOf("/investicne-poradenstvo-premium-kontakt") === 0) return true;
    if ((path === "/kontakt" || path === "/kontakty") && isConsultButtonText(text)) return true;
    return false;
  }

  function shouldKeepFirstConsultationText(button) {
    var currentPath = localPath(window.location.href);
    var text = fold(button.textContent);
    return currentPath === FIRST_PATH && /^prva konzultacia$/.test(text);
  }

  function normalizeButtons() {
    var buttons = Array.prototype.slice.call(document.querySelectorAll(
      "a.sqs-block-button-element, a.ph-footer-btn, a.wm-btn, a.ph-kt-mapbtn"
    ));

    buttons.forEach(function (button) {
      var text = norm(button.textContent);
      button.classList.add("ph-consistent-button");

      var isFooterCta = button.classList.contains("ph-footer-btn");
      var isConsult = isFooterCta || (!isFunctionalButtonText(text) && (isConsultButtonText(text) || isConsultHref(button.getAttribute("href"), text)));
      if (!isConsult) return;

      button.classList.add("ph-consultation-cta");
      button.classList.remove("sqs-button-element--primary", "sqs-button-element--tertiary");
      if (!button.classList.contains("sqs-button-element--secondary")) button.classList.add("sqs-button-element--secondary");

      button.setAttribute("href", CTA_HREF);
      button.textContent = shouldKeepFirstConsultationText(button) ? FIRST_TEXT : CTA_TEXT;
    });
  }

  function normalizeSubmitButtons() {
    Array.prototype.forEach.call(document.querySelectorAll("button.form-submit-button, input[type='submit'], button[type='submit']"), function (button) {
      button.classList.add("ph-consistent-button");
    });
  }

  function run() {
    normalizeButtons();
    normalizeSubmitButtons();
  }

  function schedule() {
    if (schedule.pending) return;
    schedule.pending = true;
    window.requestAnimationFrame(function () {
      schedule.pending = false;
      run();
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
  window.addEventListener("load", run);
  [250, 1000, 2500].forEach(function (delay) { window.setTimeout(run, delay); });
  if ("MutationObserver" in window) {
    new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
  }
})();

    el.style.setProperty("text-decoration", "none", "important");
    el.style.setProperty("text-transform", "none", "important");
    el.style.setProperty("white-space", "normal", "important");
    el.style.setProperty("box-shadow", "none", "important");
  }

  function bind(el) {
    setStyle(el, BASE);
    if (el.getAttribute("data-ph-vc-inline") === "1") return;
    el.setAttribute("data-ph-vc-inline", "1");
    el.addEventListener("mouseenter", function () { setStyle(el, HOVER); }, { passive: true });
    el.addEventListener("mouseleave", function () { setStyle(el, BASE); }, { passive: true });
    el.addEventListener("focus", function () { setStyle(el, HOVER); }, { passive: true });
    el.addEventListener("blur", function () { setStyle(el, BASE); }, { passive: true });
  }

  function run() {
    Array.prototype.forEach.call(document.querySelectorAll(SELECTOR), bind);
  }

  function schedule() {
    if (schedule.pending) return;
    schedule.pending = true;
    window.requestAnimationFrame(function () {
      schedule.pending = false;
      run();
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
  window.addEventListener("load", run);
  [250, 1000, 2500].forEach(function (delay) { window.setTimeout(run, delay); });
  if ("MutationObserver" in window) {
    new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>

<script>
/* Sprievodca v kalkulačke privátnej renty si sám scrollovať nemôže: rám je
   zámerne zamknutý na 0,0 (inak by vnorené posúvanie kradlo scroll celej
   stránke) a je na inej doméne. Pri každom kroku preto pošle rozsah, ktorý
   má byť vidieť (prstenec aj bublinu naraz), a odscrollujeme ho tu - ale len
   ak naozaj treba. Bez toho ostali kroky 7 a 8 mimo obrazovky. */
(function () {
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "ph-renta-scroll") return;
    if (typeof d.top !== "number" || typeof d.bottom !== "number") return;
    var f = document.querySelector('iframe[src*="cara-zivota"]');
    if (!f) return;
    var base = f.getBoundingClientRect().top + window.scrollY;
    var top = base + d.top, bottom = base + d.bottom;
    var okraj = 24;
    var horny = window.scrollY + okraj;
    var dolny = window.scrollY + window.innerHeight - okraj;
    if (top >= horny && bottom <= dolny) return;
    var vyska = bottom - top;
    var ciel = vyska > (window.innerHeight - okraj * 2)
      ? top - okraj
      : top - (window.innerHeight - vyska) / 2;
    window.scrollTo({ top: Math.max(0, Math.round(ciel)), behavior: "smooth" });
  });
})();
</script>
